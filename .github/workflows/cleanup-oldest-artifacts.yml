name: Cleanup oldest Actions artifacts
on:
  pull_request:
    branches: [ main ]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete oldest artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const limit=238;
            const {owner,repo}=context.repo;
            const artifacts=await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,per_page:100});
            artifacts.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
            let deleted=0,bytes=0;
            for(const a of artifacts.slice(0,limit)){await github.rest.actions.deleteArtifact({owner,repo,artifact_id:a.id});deleted++;bytes+=a.size_in_bytes||0;}
            core.info(`CLEANUP_RESULT deleted=${deleted} bytes=${bytes}`);
