name: Build Release APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'bmi-v*.zip'
      - '.github/workflows/build-release-apk-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
      BAZAAR_PURCHASE_PRODUCT_ID: ${{ secrets.BAZAAR_PURCHASE_PRODUCT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls -1 bmi-v*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "No bmi-v*.zip file found in repository root. Upload bmi-v13.zip to the root of this repository."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_FILE"

      - name: Unzip Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted project
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted
          SETTINGS_FILE=$(find extracted -name settings.gradle -type f -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle inside ZIP."
            find extracted -maxdepth 4 -type f | sort | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          mv "$PROJECT_DIR" project
          echo "Project extracted to ./project"
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD BAZAAR_RSA_PUBLIC_KEY BAZAAR_PURCHASE_PRODUCT_ID; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required secrets in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > project/release.keystore
          test -s project/release.keystore

      - name: Create local.properties
        shell: bash
        run: |
          set -euo pipefail
          cat > project/local.properties <<EOF
          BAZAAR_RSA_PUBLIC_KEY=$BAZAAR_RSA_PUBLIC_KEY
          BAZAAR_PURCHASE_PRODUCT_ID=$BAZAAR_PURCHASE_PRODUCT_ID
          SIGNING_STORE_FILE=release.keystore
          SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS
          SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          EOF
          sed -i 's/^ *//' project/local.properties
          echo "local.properties created."

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project/gradlew ]; then
            chmod +x project/gradlew
          fi

      - name: Build release APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmi14-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
